name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - run: ./scripts/build.sh "${GITHUB_REF_NAME}"
      - name: publish GitHub release (unsigned alpha)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned alpha build. Verify checksums.txt before running. See docs/release.md." \
            --prerelease \
            dist/*
