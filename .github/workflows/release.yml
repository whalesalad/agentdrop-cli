name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - run: ./scripts/build.sh "${GITHUB_REF_NAME}"
      - name: publish GitHub release (unsigned alpha)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not flagged --prerelease on purpose: GitHub's releases/latest pointer
          # skips prereleases, and the installers and `agentdrop update` resolve
          # "latest" through releases/latest/download/manifest.json.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --latest \
            --notes "Alpha build for early testers. Unsigned executables; verify checksums.txt. Install and update instructions: https://agentdrop.lol/docs/cli" \
            dist/*
