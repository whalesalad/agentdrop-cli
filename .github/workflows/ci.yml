name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - name: cross-build the primary matrix
        run: ./scripts/build.sh ci
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: full test suite on Windows
        run: go test ./...
      - name: native exe smoke (PowerShell)
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -o agentdrop.exe ./cmd/agentdrop
          .\scripts\smoke-windows.ps1 .\agentdrop.exe
      - name: native exe smoke (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\smoke-windows.ps1 .\agentdrop.exe
      - name: exe smoke (cmd.exe)
        shell: cmd
        run: |
          .\agentdrop.exe --version
          if errorlevel 1 exit /b 1
